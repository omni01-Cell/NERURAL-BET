[project]
name = "neural-bet"
version = "0.1.0"
description = "Football analysis with cooperating AI agents and a terminal interface"
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["langchain==1.4.7", "langgraph==1.2.16", "langchain-google-genai==4.4.2", "langchain-groq==1.1.3", "langchain-mistralai==1.1.6", "langchain-openai==1.7.2", "pydantic==2.14.1", "python-dotenv==1.2.4", "colorama==0.4.6", "tenacity==9.1.4", "aiohttp==3.14.5", "beautifulsoup4==4.15.0", "pandas==3.1.0", "lxml==6.1.3", "textual==8.2.8", "understat==0.1.4", "soccerdata==2026.43.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.2", "pip-audit==2.10.1", "build==1.6.1", "poetry-core==2.5.0", "pyyaml==6.0.3"]

[project.scripts]
neuralbet = "src.cli:main"
neuralbet-pipeline = "src.cli:run_pipeline"

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
asyncio_mode = "strict"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
