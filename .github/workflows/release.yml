name: Propose version
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable version, for example 0.2.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: propose-version
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate and update version
        env:
          NEXT_VERSION: ${{ inputs.version }}
        run: python scripts/propose_version.py
      - name: Create version branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="release/v${NEXT_VERSION}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml
          git commit -m "chore(release): propose ${NEXT_VERSION}"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "chore(release): propose ${NEXT_VERSION}" --body 'Version-only change. Human review and merge required; no tag or package has been published.'
          gh workflow run ci.yml --ref "$branch"
